services:
  landing-air:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airobotic-landing
    restart: unless-stopped
    # Mở cổng 4545 ra ngoài để Nginx Proxy / mạng ngoài có thể kết nối (0.0.0.0:4545)
    ports:
      - "${HOST_PORT:-4545}:4545"
    env_file:
      - .env
    environment:
      - PORT=4545
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

